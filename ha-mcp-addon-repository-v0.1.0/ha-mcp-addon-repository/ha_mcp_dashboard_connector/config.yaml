name: "Home Assistant MCP Dashboard Connector"
version: "0.1.0"
slug: "ha_mcp_dashboard_connector"
description: "Lokaler MCP-Connector für sichere, zunächst nur lesende Dashboard-Arbeit."
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
host_network: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "MCP Streamable HTTP (LAN; Bearer-Token erforderlich)"
options:
  mcp_auth_token: ""
  ha_token: ""
  ha_base_url: "http://homeassistant:8123"
  allowed_hosts:
    - "homeassistant.local:8099"
    - "localhost:8099"
    - "127.0.0.1:8099"
schema:
  mcp_auth_token: str
  ha_token: str
  ha_base_url: str
  allowed_hosts:
    - str
